name: quiksee
description: A new Flutter application.
publish_to: 'none'
version: 4.1.2+7

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^9.2.0
  # get: ^4.7.2
  http: ^1.6.0
  shared_preferences: ^2.5.4
  dio: ^5.9.1
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  url_strategy: ^0.3.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.0
  path_provider: ^2.1.5
  vibration: ^3.1.6
  shimmer: ^3.0.0
  flutter_widget_from_html_core: ^0.17.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  connectivity_plus: ^7.0.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  country_code_picker: ^3.4.1
  expandable: ^5.0.1
  custom_map_markers: ^0.0.2+1
  flutter_polyline_points: ^3.1.0
  timeago: ^3.7.1
  dotted_border: ^3.1.0
  expandable_bottom_sheet: ^1.1.1+1
  syncfusion_flutter_datepicker: ^32.2.4
  flutter_spinkit: ^5.2.2
  flutter_typeahead: ^5.2.0
  flutter_html: ^3.0.0
  pin_code_fields: ^8.0.1
  readmore: ^3.0.0
  cached_network_image: ^3.4.1
  permission_handler: ^12.0.1
  emoji_picker_flutter: ^4.4.0
  file_picker: ^10.3.10
  flutter_downloader: ^1.12.0
  open_file: ^3.5.11
  carousel_slider: ^5.1.2
  image: ^4.7.2
  video_player: ^2.10.1
  chewie: ^1.13.0
  get_thumbnail_video: ^0.7.3
  dotted_line: ^3.2.3
  flutter_keyboard_visibility: ^6.0.0
  get: #^4.7.2
    git:
      url: https://github.com/luis901101/getx_fork.git
      ref: old-4.7.0



  google_maps_flutter: any
  collection: any
  path: any
  http_parser: any
  flutter_svg: ^2.2.3
  flutter_ringtone_player: ^4.0.0+4
  qr_flutter: ^4.1.0
  google_navigation_flutter: ^0.10.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true

flutter:

  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/
    - assets/language/
    - assets/svg/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700